<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yearpulse — what per cent of the year is already gone?</title>
<meta name="description" content="This year, as a pulse: a live percentage of the year, correct for your timezone — DST and calendar skips included. Watch six cities hold the same year at six different speeds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='18' y='4' width='28' height='56' rx='4' fill='%2326262c'/%3E%3Crect x='18' y='26' width='28' height='34' rx='4' fill='%23e8b25e'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; --dim: #8a867c; --txt: #e8e4d8; --bg: #101014; --amber: #e8b25e; --amber2: #d97a3d; }
  @media (prefers-color-scheme: light) {
    :root { --dim: #6b675f; --txt: #1c1b18; --bg: #f6f4ee; --amber: #c47a20; --amber2: #a5541e; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--txt);
    min-height: 100dvh; padding: clamp(1rem, 4vh, 3rem) 1.25rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; -webkit-font-smoothing: antialiased;
  }
  .stage { display: flex; align-items: center; gap: clamp(1.5rem, 6vw, 4.5rem); }
  /* vertical pulse bar, width:height ≈ 1:3.6 — the light (year still left)
     settles to the bottom; the drained part falls away from the top */
  .vbar {
    position: relative; width: clamp(3.2rem, 8vw, 4.4rem); height: clamp(11.5rem, 30vh, 15.8rem);
    border-radius: .45rem; background: color-mix(in srgb, var(--txt) 8%, transparent);
    overflow: hidden; flex: none;
  }
  .vbar .remain {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, var(--amber2), var(--amber) 65%, #f4d9a8);
    box-shadow: 0 0 22px color-mix(in srgb, var(--amber) 45%, transparent);
  }
  .vbar .nowline {
    position: absolute; left: 0; right: 0; height: 1px;
    background: var(--txt); opacity: .9;
  }
  .vbar .nowline::after {
    content: ""; position: absolute; left: 0; top: -3px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--txt);
  }
  .panel { text-align: left; }
  .year { font-size: .82rem; letter-spacing: .35em; text-transform: uppercase; color: var(--dim); }
  .pct {
    font: 800 clamp(3.4rem, 15vw, 8.2rem)/1.02 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; letter-spacing: -.045em; margin: .12em 0 .1em;
  }
  .pct small { font-size: .3em; font-weight: 600; opacity: .5; letter-spacing: 0; }
  .meta { font-size: .92rem; color: var(--dim); }
  .meta b { color: var(--txt); font-weight: 600; }
  .tz { margin-top: .35rem; font-size: .78rem; color: var(--dim); }
  .tz code { font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* world row: six cities holding the same year at different speeds */
  .world {
    margin-top: clamp(2rem, 7vh, 3.6rem);
    display: grid; grid-template-columns: repeat(6, minmax(4.6rem, 1fr));
    gap: clamp(.4rem, 1.6vw, 1.2rem);
    width: min(46rem, 94vw);
  }
  .city .cname { font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .city .cdate { font-size: .82rem; margin: .1rem 0 .18rem; font-variant-numeric: tabular-nums; }
  .city .cpct { font: 600 .95rem/1 ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .city .cbar { margin-top: .35rem; height: .22rem; border-radius: 99px; background: color-mix(in srgb, var(--txt) 10%, transparent); overflow: hidden; }
  .city .cbar i { display: block; height: 100%; background: var(--amber); border-radius: 99px; }
  @media (max-width: 34rem) {
    .world { grid-template-columns: repeat(3, 1fr); row-gap: 1.1rem; }
    .stage { flex-direction: column-reverse; gap: 1.6rem; }
    .panel { text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .vbar .remain, .vbar .nowline { transition: none; } }
  footer { margin-top: clamp(1.6rem, 6vh, 3rem); font-size: .72rem; color: var(--dim); }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div class="stage">
    <div class="vbar" role="progressbar" aria-label="Year progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="remain" id="remain"></div>
      <div class="nowline" id="nowline"></div>
    </div>
    <div class="panel">
      <div class="year" id="year">—</div>
      <div class="pct"><span id="num">…</span><small>%</small></div>
      <p class="meta" id="meta">…</p>
      <p class="tz" id="tzline">…</p>
    </div>
  </div>
  <div class="world" id="world" aria-label="The same year, six timezones"></div>
  <footer><a href="https://github.com/w1977-0/yearpulse" rel="noopener">yearpulse</a> · timezone-correct by UTC arithmetic · <a href="https://github.com/w1977-0/yearpulse#why-most-year-progress-pages-are-wrong" rel="noopener">why this one is right</a></footer>
<script>
// yearmath.js — yearpulse core math. Zero dependencies, runs in browser and Node.
//
// The one rule that makes this correct everywhere: every quantity is compared
// in a TOTAL ORDER of local wall-clock seconds, and all arithmetic is done on
// UTC timestamps. Wall-clock weirdness (DST shifts, Samoa's skipped
// 2011-12-30, half-hour offsets, 25-hour fall-back days) is absorbed because
// local year boundaries are located on the UTC timeline by bisection over
// that total order — no offset tables, no date library, just the platform's
// IANA database via Intl.
//
//   progress = (now_utc - jan1_utc) / (nextjan1_utc - jan1_utc)

(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.yearmath = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var fmtCache = {};
  var zoneSupport = {};

  function supportsZone(tz) {
    if (zoneSupport[tz] !== undefined) return zoneSupport[tz];
    try {
      new Intl.DateTimeFormat("en-US", { timeZone: tz }).format(new Date());
      zoneSupport[tz] = true;
    } catch (e) {
      zoneSupport[tz] = false;
    }
    return zoneSupport[tz];
  }

  // Cached formatter for a zone; returns a function ms -> local parts.
  function partsFormatter(tz) {
    if (fmtCache[tz]) return fmtCache[tz];
    var dtf = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      year: "numeric", month: "numeric", day: "numeric",
      hour: "numeric", minute: "numeric", second: "numeric",
      hour12: false
    });
    fmtCache[tz] = function (ms) {
      var p = dtf.formatToParts(new Date(ms));
      var o = { year: 0, month: 0, day: 0, hour: 0, minute: 0, second: 0 };
      for (var i = 0; i < p.length; i++) {
        var t = p[i].type, v = p[i].value;
        if (t === "year") o.year = +v;
        else if (t === "month") o.month = +v - 1;
        else if (t === "day") o.day = +v;
        else if (t === "hour") o.hour = +v % 24; // hour12:false can emit "24"
        else if (t === "minute") o.minute = +v;
        else if (t === "second") o.second = +v;
      }
      return o;
    };
    return fmtCache[tz];
  }

  // Total-order key for an instant in a zone:
  //   (local civil day number) * 86400 + seconds within that day.
  // Monotonic non-decreasing along the UTC timeline, strictly increasing
  // except across jumps — exactly what bisection needs.
  function dayKey(tz, ms) {
    var p = partsFormatter(tz)(ms);
    return (Date.UTC(p.year, p.month, p.day) / 86400000) * 86400
      + p.hour * 3600 + p.minute * 60 + p.second;
  }

  // The UTC instant (ms, rounded) at which zone `tz` shows the first
  // 00:00:00 of the given local date — i.e. the local day's midnight.
  // `hintMs` only seeds the ±400-day search window.
  // Returns null when the local date does not exist in that zone
  // (e.g. Pacific/Apia 2011-12-30).
  function findLocalMidnight(tz, year, month, day, hintMs) {
    if (!supportsZone(tz)) {
      return new Date(year, month, day, 0, 0, 0, 0).getTime();
    }
    var targetKey = (Date.UTC(year, month, day) / 86400000) * 86400;
    var anchor = hintMs === undefined ? Date.now() : hintMs;
    var lo = anchor - 400 * 86400000;
    var hi = anchor + 400 * 86400000;
    // Invariant: dayKey(lo) < targetKey <= dayKey(hi)
    if (dayKey(tz, hi) < targetKey) return null;      // date is past the window's end
    if (dayKey(tz, lo) >= targetKey) { hi = lo; lo = hi - 800 * 86400000; }
    for (var i = 0; i < 64; i++) {
      var mid = lo + (hi - lo) / 2;
      if (dayKey(tz, mid) < targetKey) lo = mid;
      else hi = mid;
    }
    var found = Math.round(hi);
    // The local day may not exist (skipped calendar day): verify the landing
    // instant really shows the requested date, else report absence.
    var p = partsFormatter(tz)(found + 43200000); // midday of the candidate local day
    if (p.year !== year || p.month !== month || p.day !== day) return null;
    return found;
  }

  // UTC boundaries of the local year `year` in zone `tz`.
  function yearBoundariesUTC(tz, year, nowMs) {
    var anchor = nowMs === undefined ? Date.now() : nowMs;
    var start = findLocalMidnight(tz, year, 0, 1, anchor);
    var end = findLocalMidnight(tz, year + 1, 0, 1, anchor);
    return { start: start, end: end };
  }

  function resolveZone(explicit) {
    if (explicit) return explicit;
    try {
      var z = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (z && supportsZone(z)) return z;
    } catch (e) {}
    return "UTC";
  }

  function localYearOf(tz, ms) {
    if (!supportsZone(tz)) return new Date(ms).getFullYear();
    return partsFormatter(tz)(ms).year;
  }

  // 1-based day of year via UTC-diff against local Jan 1st (DST never
  // double-counts because both endpoints are instants on the UTC line).
  function localDayOfYear(tz, ms) {
    var y = localYearOf(tz, ms);
    var jan1 = findLocalMidnight(tz, y, 0, 1, ms);
    if (jan1 === null) return 1; // zone-local year without a Jan 1: pathological
    return Math.floor((ms - jan1) / 86400000) + 1;
  }

  // Main entry: everything about "now" in a zone.
  function yearPulse(opts, nowMs) {
    var explicit = opts && opts.tz;
    var tz = resolveZone(explicit);
    if (!supportsZone(tz)) tz = "UTC"; // unknown override falls back to UTC
    var now = nowMs !== undefined ? nowMs : Date.now();
    var year = localYearOf(tz, now);
    var b = yearBoundariesUTC(tz, year, now);
    if (b.start === null || b.end === null) {
      // Zone without a resolvable year boundary — degrade to UTC rather than lie.
      tz = "UTC";
      year = new Date(now).getUTCFullYear();
      b = yearBoundariesUTC(tz, year, now);
    }
    var total = b.end - b.start;
    var progress = total > 0 ? (now - b.start) / total : 0;
    if (progress < 0) progress = 0;
    if (progress > 1) progress = 1;

    var dayOfYear = localDayOfYear(tz, now);
    var daysInYear = Math.round(total / 86400000); // 365, 366, or 364 (Samoa 2011)
    var daysLeft = Math.max(0, daysInYear - dayOfYear);
    var msLeft = Math.max(0, b.end - now);
    var weekOfYear = Math.floor((dayOfYear - 1) / 7) + 1;

    return {
      timezone: tz,
      year: year,
      progress: progress,
      percent: progress * 100,
      dayOfYear: dayOfYear,
      daysInYear: daysInYear,
      daysLeft: daysLeft,
      msLeft: msLeft,
      weekOfYear: weekOfYear,
      yearStart: b.start,
      yearEnd: b.end
    };
  }

  return {
    yearPulse: yearPulse,
    yearBoundariesUTC: yearBoundariesUTC,
    findLocalMidnight: findLocalMidnight,
    resolveZone: resolveZone,
    supportsZone: supportsZone,
    localYearOf: localYearOf,
    localDayOfYear: localDayOfYear,
    dayKey: dayKey
  };
});


(function () {
  "use strict";
  // ---- viewer zone: ?tz= override, else the browser's, else UTC -----------
  var explicit = null;
  try {
    var q = new URLSearchParams(location.search).get("tz");
    if (q && yearmath.supportsZone(q)) explicit = q;
  } catch (e) {}

  // Six cities chosen for human coverage: these zones hold roughly three
  // quarters of humanity (E-Asia +8, India +5:30, W-Africa/Europe +1~2,
  // US-East -5, Moscow-to-Nairobi +3, Brazil-East -3) and between them
  // exercise every offset story: half-hour, DST-on, DST-off, southern year.
  var WORLD = [
    { city: "Shanghai",  tz: "Asia/Shanghai"     },
    { city: "New Delhi", tz: "Asia/Kolkata"     },
    { city: "Moscow",    tz: "Europe/Moscow"    },
    { city: "Paris",     tz: "Europe/Paris"     },
    { city: "São Paulo", tz: "America/Sao_Paulo" },
    { city: "New York",  tz: "America/New_York" }
  ];

  var elNum = document.getElementById("num");
  var elMeta = document.getElementById("meta");
  var elYear = document.getElementById("year");
  var elTz = document.getElementById("tzline");
  var elRemain = document.getElementById("remain");
  var elNowline = document.getElementById("nowline");
  var elBar = document.querySelector(".vbar");
  var elWorld = document.getElementById("world");
  var fmtDays = new Intl.NumberFormat();

  // Build the world grid once; keep live nodes for the render loop.
  var worldCells = WORLD.map(function (w) {
    var cell = document.createElement("div");
    cell.className = "city";
    var name = document.createElement("div"); name.className = "cname"; name.textContent = w.city;
    var date = document.createElement("div"); date.className = "cdate";
    var pct = document.createElement("div"); pct.className = "cpct";
    var bar = document.createElement("div"); bar.className = "cbar";
    var fill = document.createElement("i"); bar.appendChild(fill);
    cell.appendChild(name); cell.appendChild(date); cell.appendChild(pct); cell.appendChild(bar);
    elWorld.appendChild(cell);
    var dateFmt;
    try { dateFmt = new Intl.DateTimeFormat(undefined, { timeZone: w.tz, weekday: "narrow", month: "short", day: "numeric" }); }
    catch (e) { dateFmt = new Intl.DateTimeFormat(undefined, { timeZone: "UTC", month: "short", day: "numeric" }); }
    return { tz: w.tz, dateEl: date, pctEl: pct, fillEl: fill, dateFmt: dateFmt, last: {} };
  });

  var lastNum = "", lastBar = -1, lastMeta = "";

  function render() {
    var r = yearmath.yearPulse({ tz: explicit });

    var text = r.percent.toFixed(4);
    if (text !== lastNum) { elNum.textContent = text; lastNum = text; }

    // Bar: 0.1% steps only — the now-line rides on the drain surface.
    var step = Math.floor(r.progress * 1000) / 1000;
    if (step !== lastBar) {
      var remainPct = (1 - step) * 100;
      elRemain.style.height = remainPct.toFixed(1) + "%";
      elNowline.style.bottom = remainPct.toFixed(1) + "%";
      elBar.setAttribute("aria-valuenow", (step * 100).toFixed(1));
      lastBar = step;
    }

    var meta = "day <b>" + fmtDays.format(r.dayOfYear) + "</b> of " + fmtDays.format(r.daysInYear) +
      " · <b>" + fmtDays.format(r.daysLeft) + "</b> days left · week " + r.weekOfYear;
    if (meta !== lastMeta) {
      elMeta.innerHTML = meta; lastMeta = meta;
      elYear.textContent = r.year;
      elTz.innerHTML = "computed for <code>" + r.timezone + "</code>" + (explicit ? " (via ?tz=)" : "");
    }

    // World row: one instant, six zones.
    var nowMs = Date.now();
    for (var i = 0; i < worldCells.length; i++) {
      var c = worldCells[i];
      var w = yearmath.yearPulse({ tz: c.tz }, nowMs);
      var wPct = w.percent.toFixed(2) + "%";
      if (c.last.pct !== wPct) { c.pctEl.textContent = wPct; c.last.pct = wPct; }
      var wFill = (Math.floor(w.progress * 1000) / 10).toFixed(1) + "%";
      if (c.last.fill !== wFill) { c.fillEl.style.width = wFill; c.last.fill = wFill; }
      var wDate = c.dateFmt.format(new Date(nowMs));
      if (c.last.date !== wDate) { c.dateEl.textContent = wDate; c.last.date = wDate; }
    }

    if (typeof requestAnimationFrame === "function") requestAnimationFrame(render);
    else setTimeout(render, 250);
  }

  render();
})();
</script>
</body>
</html>
