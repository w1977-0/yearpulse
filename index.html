<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yearpulse — what per cent of the year is already gone?</title>
<meta name="description" content="This year, as a pulse: a live percentage of the year, correct for your timezone — DST and calendar skips included. Watch six cities hold the same year at six different speeds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='24' width='36' height='16' fill='%23111'/%3E%3Crect x='40' y='24' width='20' height='16' fill='none' stroke='%23111' stroke-width='2'/%3E%3Cpath d='M40 24 48 40 56 24 64 40 72 24'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --ink: #141311;        /* the elapsed: solid fact */
    --paper: #fdfcf8;      /* the bar's own paper — one step brighter than the page */
    --fg: #141311;
    --bg: #f4f2ec;
    --faint: rgba(20,19,17,.55);
    --hair: rgba(20,19,17,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2efe8; --paper: #1b1b1f; --fg: #ece9e2; --bg: #101010; --faint: rgba(242,239,232,.55); --hair: rgba(242,239,232,.16); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    font: 16px/1.45 ui-sans-serif, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
    min-height: 100dvh;
    display: grid; place-items: center;
    padding: clamp(1.2rem, 5vh, 3.5rem) 1.25rem;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  main { width: min(52rem, 94vw); }
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin-bottom: .9rem;
  }
  .masthead .brand { font-weight: 700; letter-spacing: .3em; font-size: .95rem; text-transform: uppercase; }
  .masthead .mast-note { font-size: .78rem; color: var(--faint); letter-spacing: .02em; }

  /* the meter: percent on the left, hatched bar to its right */
  .meter {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: clamp(1rem, 3.5vw, 2.2rem);
    margin-top: .4rem;
  }
  .pct {
    font: 700 clamp(3.2rem, 11.5vw, 6.4rem)/0.94 system-ui, "Helvetica Neue", Helvetica, sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.03em;
    text-align: right;
    white-space: nowrap;
  }
  .pct small { font-size: .38em; font-weight: 650; letter-spacing: 0; vertical-align: .28em; margin-left: .04em; }
  .pct .digits { display: inline-block; min-width: 5ch; } /* 100.00 worst case: the bar never jumps */
  .scale {
    position: relative; height: clamp(3rem, 8vw, 4.6rem);
    background: var(--paper);
    border: 2px solid var(--fg);
    overflow: hidden;
  }
  .scale .gone {                     /* elapsed — solid ink, a fact */
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--ink);
  }
  .scale .left {                      /* remaining — hatched reservation */
    position: absolute; top: 0; bottom: 0; right: 0;
    background-image: repeating-linear-gradient(45deg, var(--fg) 0 1px, transparent 1px 7px);
  }
  .scale .now {                        /* the present — a clean hairline */
    position: absolute; top: -2px; bottom: -2px; width: 2px;
    background: var(--fg);
    outline: 2px solid var(--bg);     /* keep it legible over the hatch */
  }

  .rule { border: 0; border-top: 1px solid var(--hair); margin: 1.15rem 0 1rem; }

  .facts { display: flex; flex-wrap: wrap; gap: .45rem 1.6rem; font-size: .82rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .facts b { color: var(--fg); font-weight: 600; }
  .facts .zone { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .76rem; }

  /* the world: one instant, six zones, one strict grid */
  .world {
    margin-top: 1.6rem;
    display: grid; grid-template-columns: repeat(6, 1fr);
    border-top: 1px solid var(--hair);
  }
  .city {
    padding: .7rem .9rem .75rem 0;
    border-bottom: 1px solid var(--hair);
  }
  .city + .city { border-left: 1px solid var(--hair); padding-left: .9rem; }
  .cname { font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .cdate { font-size: .8rem; color: var(--faint); margin-top: .18rem; font-variant-numeric: tabular-nums; }
  .cpct { font: 650 .92rem/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; margin-top: .3rem; }
  .cbar { position: relative; height: .38rem; margin-top: .34rem; background: var(--paper); border: 1px solid var(--fg); }
  .cbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .cbar u { position: absolute; top: 0; bottom: 0; right: 0; background-image: repeating-linear-gradient(45deg, var(--fg) 0 1px, transparent 1px 4px); }

  footer { margin-top: 1.5rem; font-size: .7rem; color: var(--faint); display: flex; gap: 1.4rem; flex-wrap: wrap; }
  footer a { color: inherit; }

  @media (max-width: 40rem) {
    .world { grid-template-columns: repeat(3, 1fr); }
    .city:nth-child(4) { border-left: 0; padding-left: 0; }
    .meter { grid-template-columns: 1fr; row-gap: 1rem; }
    .pct { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { .scale, .scale * { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="masthead">
    <span class="brand" id="year">—</span>
    <span class="mast-note">what per cent of the year is already gone</span>
  </div>
  <div class="meter">
    <div class="pct" id="num"><span class="digits">…</span><small>%</small></div>
    <div class="scale" role="progressbar" aria-label="Year progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="gone" id="gone"></div>
      <div class="left" id="left"></div>
      <div class="now" id="now"></div>
    </div>
  </div>
  <hr class="rule">
  <div class="facts">
    <span>day <b id="doy">—</b> of <span id="diy">—</span></span>
    <span><b id="left-days">—</b> days left</span>
    <span>week <b id="woy">—</b></span>
    <span class="zone" id="tzline">…</span>
  </div>
  <div class="world" id="world" aria-label="The same year, six timezones"></div>
  <footer><span>timezone-correct by UTC arithmetic</span><a href="https://github.com/w1977-0/yearpulse" rel="noopener">yearpulse</a><a href="https://github.com/w1977-0/yearpulse#why-most-year-progress-pages-are-wrong" rel="noopener">why this one is right</a></footer>
</main>
<script>
// yearmath.js — yearpulse core math. Zero dependencies, runs in browser and Node.
//
// The one rule that makes this correct everywhere: every quantity is compared
// in a TOTAL ORDER of local wall-clock seconds, and all arithmetic is done on
// UTC timestamps. Wall-clock weirdness (DST shifts, Samoa's skipped
// 2011-12-30, half-hour offsets, 25-hour fall-back days) is absorbed because
// local year boundaries are located on the UTC timeline by bisection over
// that total order — no offset tables, no date library, just the platform's
// IANA database via Intl.
//
//   progress = (now_utc - jan1_utc) / (nextjan1_utc - jan1_utc)

(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.yearmath = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var fmtCache = {};
  var zoneSupport = {};

  function supportsZone(tz) {
    if (zoneSupport[tz] !== undefined) return zoneSupport[tz];
    try {
      new Intl.DateTimeFormat("en-US", { timeZone: tz }).format(new Date());
      zoneSupport[tz] = true;
    } catch (e) {
      zoneSupport[tz] = false;
    }
    return zoneSupport[tz];
  }

  // Cached formatter for a zone; returns a function ms -> local parts.
  function partsFormatter(tz) {
    if (fmtCache[tz]) return fmtCache[tz];
    var dtf = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      year: "numeric", month: "numeric", day: "numeric",
      hour: "numeric", minute: "numeric", second: "numeric",
      hour12: false
    });
    fmtCache[tz] = function (ms) {
      var p = dtf.formatToParts(new Date(ms));
      var o = { year: 0, month: 0, day: 0, hour: 0, minute: 0, second: 0 };
      for (var i = 0; i < p.length; i++) {
        var t = p[i].type, v = p[i].value;
        if (t === "year") o.year = +v;
        else if (t === "month") o.month = +v - 1;
        else if (t === "day") o.day = +v;
        else if (t === "hour") o.hour = +v % 24; // hour12:false can emit "24"
        else if (t === "minute") o.minute = +v;
        else if (t === "second") o.second = +v;
      }
      return o;
    };
    return fmtCache[tz];
  }

  // Total-order key for an instant in a zone:
  //   (local civil day number) * 86400 + seconds within that day.
  // Monotonic non-decreasing along the UTC timeline, strictly increasing
  // except across jumps — exactly what bisection needs.
  function dayKey(tz, ms) {
    var p = partsFormatter(tz)(ms);
    return (Date.UTC(p.year, p.month, p.day) / 86400000) * 86400
      + p.hour * 3600 + p.minute * 60 + p.second;
  }

  // The UTC instant (ms, rounded) at which zone `tz` shows the first
  // 00:00:00 of the given local date — i.e. the local day's midnight.
  // `hintMs` only seeds the ±400-day search window.
  // Returns null when the local date does not exist in that zone
  // (e.g. Pacific/Apia 2011-12-30).
  function findLocalMidnight(tz, year, month, day, hintMs) {
    if (!supportsZone(tz)) {
      return new Date(year, month, day, 0, 0, 0, 0).getTime();
    }
    var targetKey = (Date.UTC(year, month, day) / 86400000) * 86400;
    var anchor = hintMs === undefined ? Date.now() : hintMs;
    var lo = anchor - 400 * 86400000;
    var hi = anchor + 400 * 86400000;
    // Invariant: dayKey(lo) < targetKey <= dayKey(hi)
    if (dayKey(tz, hi) < targetKey) return null;      // date is past the window's end
    if (dayKey(tz, lo) >= targetKey) { hi = lo; lo = hi - 800 * 86400000; }
    for (var i = 0; i < 64; i++) {
      var mid = lo + (hi - lo) / 2;
      if (dayKey(tz, mid) < targetKey) lo = mid;
      else hi = mid;
    }
    var found = Math.round(hi);
    // The local day may not exist (skipped calendar day): verify the landing
    // instant really shows the requested date, else report absence.
    var p = partsFormatter(tz)(found + 43200000); // midday of the candidate local day
    if (p.year !== year || p.month !== month || p.day !== day) return null;
    return found;
  }

  // UTC boundaries of the local year `year` in zone `tz`.
  function yearBoundariesUTC(tz, year, nowMs) {
    var anchor = nowMs === undefined ? Date.now() : nowMs;
    var start = findLocalMidnight(tz, year, 0, 1, anchor);
    var end = findLocalMidnight(tz, year + 1, 0, 1, anchor);
    return { start: start, end: end };
  }

  function resolveZone(explicit) {
    if (explicit) return explicit;
    try {
      var z = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (z && supportsZone(z)) return z;
    } catch (e) {}
    return "UTC";
  }

  function localYearOf(tz, ms) {
    if (!supportsZone(tz)) return new Date(ms).getFullYear();
    return partsFormatter(tz)(ms).year;
  }

  // 1-based day of year via UTC-diff against local Jan 1st (DST never
  // double-counts because both endpoints are instants on the UTC line).
  function localDayOfYear(tz, ms) {
    var y = localYearOf(tz, ms);
    var jan1 = findLocalMidnight(tz, y, 0, 1, ms);
    if (jan1 === null) return 1; // zone-local year without a Jan 1: pathological
    return Math.floor((ms - jan1) / 86400000) + 1;
  }

  // Main entry: everything about "now" in a zone.
  function yearPulse(opts, nowMs) {
    var explicit = opts && opts.tz;
    var tz = resolveZone(explicit);
    if (!supportsZone(tz)) tz = "UTC"; // unknown override falls back to UTC
    var now = nowMs !== undefined ? nowMs : Date.now();
    var year = localYearOf(tz, now);
    var b = yearBoundariesUTC(tz, year, now);
    if (b.start === null || b.end === null) {
      // Zone without a resolvable year boundary — degrade to UTC rather than lie.
      tz = "UTC";
      year = new Date(now).getUTCFullYear();
      b = yearBoundariesUTC(tz, year, now);
    }
    var total = b.end - b.start;
    var progress = total > 0 ? (now - b.start) / total : 0;
    if (progress < 0) progress = 0;
    if (progress > 1) progress = 1;

    var dayOfYear = localDayOfYear(tz, now);
    var daysInYear = Math.round(total / 86400000); // 365, 366, or 364 (Samoa 2011)
    var daysLeft = Math.max(0, daysInYear - dayOfYear);
    var msLeft = Math.max(0, b.end - now);
    var weekOfYear = Math.floor((dayOfYear - 1) / 7) + 1;

    return {
      timezone: tz,
      year: year,
      progress: progress,
      percent: progress * 100,
      dayOfYear: dayOfYear,
      daysInYear: daysInYear,
      daysLeft: daysLeft,
      msLeft: msLeft,
      weekOfYear: weekOfYear,
      yearStart: b.start,
      yearEnd: b.end
    };
  }

  return {
    yearPulse: yearPulse,
    yearBoundariesUTC: yearBoundariesUTC,
    findLocalMidnight: findLocalMidnight,
    resolveZone: resolveZone,
    supportsZone: supportsZone,
    localYearOf: localYearOf,
    localDayOfYear: localDayOfYear,
    dayKey: dayKey
  };
});


(function () {
  "use strict";
  var explicit = null;
  try {
    var q = new URLSearchParams(location.search).get("tz");
    if (q && yearmath.supportsZone(q)) explicit = q;
  } catch (e) {}

  var WORLD = [
    { city: "Shanghai",  tz: "Asia/Shanghai"     },
    { city: "New Delhi", tz: "Asia/Kolkata"     },
    { city: "Moscow",    tz: "Europe/Moscow"    },
    { city: "Paris",     tz: "Europe/Paris"     },
    { city: "São Paulo", tz: "America/Sao_Paulo" },
    { city: "New York",  tz: "America/New_York" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var elPct = $("num"), elGone = $("gone"), elLeft = $("left"), elNow = $("now");
  var elYear = $("year"), elDoy = $("doy"), elDiy = $("diy"),
      elLeftDays = $("left-days"), elWoy = $("woy"), elTz = $("tzline");
  var elWorld = $("world"), elBar = document.querySelector(".scale");
  var fmt = new Intl.NumberFormat();

  var cells = WORLD.map(function (w) {
    var cell = document.createElement("div");
    cell.className = "city";
    var name = document.createElement("div"); name.className = "cname"; name.textContent = w.city;
    var date = document.createElement("div"); date.className = "cdate";
    var pct = document.createElement("div"); pct.className = "cpct";
    var bar = document.createElement("div"); bar.className = "cbar";
    var gone = document.createElement("i"), left = document.createElement("u");
    bar.appendChild(gone); bar.appendChild(left);
    cell.appendChild(name); cell.appendChild(date); cell.appendChild(pct); cell.appendChild(bar);
    elWorld.appendChild(cell);
    var dateFmt;
    try { dateFmt = new Intl.DateTimeFormat(undefined, { timeZone: w.tz, weekday: "short", month: "short", day: "numeric" }); }
    catch (e) { dateFmt = new Intl.DateTimeFormat(undefined, { timeZone: "UTC", month: "short", day: "numeric" }); }
    return { tz: w.tz, dateEl: date, pctEl: pct, goneEl: gone, leftEl: left, dateFmt: dateFmt, last: {} };
  });

  var lastPct = "", lastBar = -1;

  function render() {
    var r = yearmath.yearPulse({ tz: explicit });

    var digits = r.percent.toFixed(4);
    if (digits !== lastPct) {
      elPct.firstChild.nodeValue = digits;   // <span class="digits"> text node
      lastPct = digits;
    }
    var step = Math.floor(r.progress * 1000) / 1000;
    if (step !== lastBar) {
      var goneW = (step * 100).toFixed(1) + "%";
      elGone.style.width = goneW;
      elNow.style.left = "calc(" + goneW + " - 1px)";
      elBar.setAttribute("aria-valuenow", (step * 100).toFixed(1));
      lastBar = step;
    }
    elYear.textContent = r.year;
    elDoy.textContent = fmt.format(r.dayOfYear);
    elDiy.textContent = fmt.format(r.daysInYear);
    elLeftDays.textContent = fmt.format(r.daysLeft);
    elWoy.textContent = r.weekOfYear;
    elTz.textContent = r.timezone + (explicit ? " (?tz=)" : "");

    var nowMs = Date.now();
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      var w = yearmath.yearPulse({ tz: c.tz }, nowMs);
      var wp = w.percent.toFixed(2) + "%";
      if (c.last.pct !== wp) { c.pctEl.textContent = wp; c.last.pct = wp; }
      var wf = (Math.floor(w.progress * 1000) / 10).toFixed(1) + "%";
      if (c.last.fill !== wf) { c.goneEl.style.width = wf; c.leftEl.style.left = wf; c.last.fill = wf; }
      var wd = c.dateFmt.format(new Date(nowMs));
      if (c.last.date !== wd) { c.dateEl.textContent = wd; c.last.date = wd; }
    }

    if (typeof requestAnimationFrame === "function") requestAnimationFrame(render);
    else setTimeout(render, 250);
  }

  render();
})();
</script>
</body>
</html>
